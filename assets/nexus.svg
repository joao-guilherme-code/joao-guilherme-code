<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Arquitetura do Nexus">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cc3ff"/>
      <stop offset="1" stop-color="#8a8cff"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#2f8cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2f8cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4cc3ff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <style>
    .sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
    .mono{font-family:'SF Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes dash{to{stroke-dashoffset:-24}}
    @keyframes breathe{0%,100%{opacity:.35}50%{opacity:.9}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    .in{opacity:0;animation:rise .8s ease-out forwards}
    .flow{fill:none;stroke:#4cc3ff;stroke-width:1.6;stroke-dasharray:5 7;opacity:.85;animation:dash 1.1s linear infinite}
    .flow2{fill:none;stroke:#8a8cff;stroke-width:1.6;stroke-dasharray:5 7;opacity:.85;animation:dash 1.1s linear infinite}
    .box{fill:#0d1729;stroke:#22385f}
    .chip{fill:#101d36;stroke:#27406b}
    .h{fill:#ffffff;font-weight:700}
    .s{fill:#8ea4c6}
    .halo{animation:breathe 4s ease-in-out infinite}
    .led{animation:blink 1.8s ease-in-out infinite}
  </style>

  <rect width="1200" height="600" rx="16" fill="#0a1020"/>
  <rect width="1200" height="600" rx="16" fill="url(#grid)"/>
  <ellipse class="halo" cx="600" cy="290" rx="330" ry="250" fill="url(#core)"/>

  <text class="mono" x="40" y="46" font-size="12" font-weight="600" fill="#4cc3ff" letter-spacing="3">ARQUITETURA · NEXUS</text>
  <text class="sans" x="40" y="74" font-size="16" fill="#a9bdd9">Assistente pessoal de IA em português, com voz, memória e ação no PC, no celular e no WhatsApp.</text>

  <text class="mono" x="40" y="124" font-size="11" fill="#6f86a8" letter-spacing="3">ENTRADAS</text>
  <text class="mono" x="900" y="124" font-size="11" fill="#6f86a8" letter-spacing="3">INTEGRAÇÕES E SAÍDAS</text>

  <g class="flow">
    <path d="M300 171 C365 171 365 200 430 200"/>
    <path d="M300 255 C365 255 365 240 430 240"/>
    <path d="M300 339 C365 339 365 280 430 280"/>
    <path d="M300 423 C365 423 365 320 430 320"/>
  </g>
  <g class="flow2">
    <path d="M770 200 C835 200 835 171 900 171"/>
    <path d="M770 240 C835 240 835 255 900 255"/>
    <path d="M770 280 C835 280 835 339 900 339"/>
    <path d="M770 320 C835 320 835 423 900 423"/>
    <path d="M600 470 L600 500"/>
  </g>

  <g class="sans">
    <g class="in" style="animation-delay:.1s">
      <rect class="box" x="40.5" y="140.5" width="259" height="62" rx="10"/>
      <text class="h" x="58" y="168" font-size="16">App do PC</text>
      <text class="s" x="58" y="188" font-size="12.5">Qt + extensão GNOME · voz e webcam locais</text>
    </g>
    <g class="in" style="animation-delay:.2s">
      <rect class="box" x="40.5" y="224.5" width="259" height="62" rx="10"/>
      <text class="h" x="58" y="252" font-size="16">Nexus Mobile</text>
      <text class="s" x="58" y="272" font-size="12.5">PWA pareada por QR code · MacroDroid</text>
    </g>
    <g class="in" style="animation-delay:.3s">
      <rect class="box" x="40.5" y="308.5" width="259" height="62" rx="10"/>
      <text class="h" x="58" y="336" font-size="16">WhatsApp</text>
      <text class="s" x="58" y="356" font-size="12.5">Evolution API · mensagens e áudio</text>
    </g>
    <g class="in" style="animation-delay:.4s">
      <rect class="box" x="40.5" y="392.5" width="259" height="62" rx="10"/>
      <text class="h" x="58" y="420" font-size="16">Terminal e API</text>
      <text class="s" x="58" y="440" font-size="12.5">cliente CLI e HTTP com token por pedido</text>
    </g>

    <g class="in" style="animation-delay:.5s">
      <rect x="430.5" y="110.5" width="339" height="360" rx="16" fill="#0c1a33" stroke="url(#accent)" stroke-width="1.4"/>
      <circle class="led" cx="458" cy="143" r="4.5" fill="#4cc3ff"/>
      <text class="h" x="472" y="148" font-size="20">nexus-server</text>
      <text class="mono s" x="456" y="170" font-size="11.5">FastAPI · Docker · rede privada Tailscale</text>

      <rect class="chip" x="456.5" y="190.5" width="287" height="50" rx="9"/>
      <text class="h" x="472" y="212" font-size="14">Cérebro</text>
      <text class="s" x="472" y="230" font-size="12">roteador de LLMs com fila que se reordena</text>

      <rect class="chip" x="456.5" y="250.5" width="287" height="50" rx="9"/>
      <text class="h" x="472" y="272" font-size="14">Memória</text>
      <text class="s" x="472" y="290" font-size="12">SQLite · hábitos, notas e regras de retenção</text>

      <rect class="chip" x="456.5" y="310.5" width="287" height="50" rx="9"/>
      <text class="h" x="472" y="332" font-size="14">Ferramentas</text>
      <text class="s" x="472" y="350" font-size="12">agenda, e-mail, tarefas, gastos, controle do PC</text>

      <rect class="chip" x="456.5" y="370.5" width="287" height="50" rx="9"/>
      <text class="h" x="472" y="392" font-size="14">Missões e rotinas</text>
      <text class="s" x="472" y="410" font-size="12">pesquisa em segundo plano · vigias · lembretes</text>

      <text class="mono" x="456" y="448" font-size="11" fill="#6f86a8">confirmação obrigatória em ações sensíveis</text>
    </g>

    <g class="in" style="animation-delay:.6s">
      <rect class="box" x="900.5" y="140.5" width="259" height="62" rx="10"/>
      <text class="h" x="918" y="168" font-size="16">Google</text>
      <text class="s" x="918" y="188" font-size="12.5">Agenda · Gmail · Drive · Contatos</text>
    </g>
    <g class="in" style="animation-delay:.7s">
      <rect class="box" x="900.5" y="224.5" width="259" height="62" rx="10"/>
      <text class="h" x="918" y="252" font-size="16">ClickUp</text>
      <text class="s" x="918" y="272" font-size="12.5">tarefas encaixadas na agenda do dia</text>
    </g>
    <g class="in" style="animation-delay:.8s">
      <rect class="box" x="900.5" y="308.5" width="259" height="62" rx="10"/>
      <text class="h" x="918" y="336" font-size="16">PC e celular</text>
      <text class="s" x="918" y="356" font-size="12.5">janelas, apps, terminal, alarmes</text>
    </g>
    <g class="in" style="animation-delay:.9s">
      <rect class="box" x="900.5" y="392.5" width="259" height="62" rx="10"/>
      <text class="h" x="918" y="420" font-size="16">Voz</text>
      <text class="s" x="918" y="440" font-size="12.5">resposta falada com áudio gerado</text>
    </g>

    <g class="in" style="animation-delay:1s">
      <rect class="box" x="40.5" y="500.5" width="339" height="70" rx="10"/>
      <text class="h" x="58" y="528" font-size="15">Segurança</text>
      <text class="s" x="58" y="548" font-size="12.5">token por requisição · porta só na rede privada</text>
      <text class="s" x="58" y="564" font-size="12.5">confirmação em ações de risco</text>
    </g>
    <g class="in" style="animation-delay:1.1s">
      <rect class="box" x="430.5" y="500.5" width="339" height="70" rx="10" stroke="#4cc3ff" stroke-opacity="0.6"/>
      <text class="h" x="448" y="528" font-size="15">Camada de modelos</text>
      <text class="s" x="448" y="548" font-size="12.5">fila gratuita + camada paga com teto mensal</text>
      <text class="s" x="448" y="564" font-size="12.5">e alertas de consumo</text>
    </g>
    <g class="in" style="animation-delay:1.2s">
      <rect class="box" x="820.5" y="500.5" width="339" height="70" rx="10"/>
      <text class="h" x="838" y="528" font-size="15">Aprendizado</text>
      <text class="s" x="838" y="548" font-size="12.5">percebe rotinas e preferências e oferece</text>
      <text class="s" x="838" y="564" font-size="12.5">ajuda na hora certa</text>
    </g>
  </g>
</svg>
