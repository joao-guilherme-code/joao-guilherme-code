<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="Pilares de atuação">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cc3ff"/>
      <stop offset="1" stop-color="#7b8cff"/>
    </linearGradient>
  </defs>
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <g>
      <rect x="0.5" y="0.5" width="375" height="189" rx="12" fill="#0d1729" stroke="#1f3256"/>
      <rect x="28" y="30" width="36" height="4" rx="2" fill="url(#accent)"/>
      <text x="28" y="72" font-size="13" font-weight="600" fill="#4cc3ff" letter-spacing="2">01</text>
      <text x="28" y="104" font-size="22" font-weight="700" fill="#ffffff">IA aplicada</text>
      <text x="28" y="136" font-size="14" fill="#a9bdd9">LLMs, agentes e automações aplicados à</text>
      <text x="28" y="156" font-size="14" fill="#a9bdd9">operação para resolver problemas reais.</text>
    </g>
    <g transform="translate(412 0)">
      <rect x="0.5" y="0.5" width="375" height="189" rx="12" fill="#0d1729" stroke="#1f3256"/>
      <rect x="28" y="30" width="36" height="4" rx="2" fill="url(#accent)"/>
      <text x="28" y="72" font-size="13" font-weight="600" fill="#4cc3ff" letter-spacing="2">02</text>
      <text x="28" y="104" font-size="22" font-weight="700" fill="#ffffff">Dados e decisão</text>
      <text x="28" y="136" font-size="14" fill="#a9bdd9">Pipelines, dashboards e análises de funil</text>
      <text x="28" y="156" font-size="14" fill="#a9bdd9">que transformam dado em decisão.</text>
    </g>
    <g transform="translate(824 0)">
      <rect x="0.5" y="0.5" width="375" height="189" rx="12" fill="#0d1729" stroke="#1f3256"/>
      <rect x="28" y="30" width="36" height="4" rx="2" fill="url(#accent)"/>
      <text x="28" y="72" font-size="13" font-weight="600" fill="#4cc3ff" letter-spacing="2">03</text>
      <text x="28" y="104" font-size="22" font-weight="700" fill="#ffffff">Liderança técnica</text>
      <text x="28" y="136" font-size="14" fill="#a9bdd9">Processos, times e tecnologia alinhados</text>
      <text x="28" y="156" font-size="14" fill="#a9bdd9">a resultado, com base em gestão de marketing.</text>
