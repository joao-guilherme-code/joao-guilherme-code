<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Números do GitHub">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cc3ff"/>
      <stop offset="1" stop-color="#8a8cff"/>
    </linearGradient>
  </defs>
  <style>
    .sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .t{opacity:0;animation:rise .9s ease-out forwards}
    .t1{animation-delay:.1s}.t2{animation-delay:.3s}.t3{animation-delay:.5s}.t4{animation-delay:.7s}
    .bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s ease-out both}
  </style>
  <g class="sans">
    <g class="t t1">
      <rect x="0.5" y="0.5" width="281" height="119" rx="12" fill="#0d1729" stroke="#22385f"/>
      <rect class="bar" x="24" y="22" width="40" height="3" rx="1.5" fill="url(#accent)" style="animation-delay:.3s"/>
      <text x="24" y="70" font-size="38" font-weight="700" fill="#ffffff">27</text>
      <text x="24" y="97" font-size="13" fill="#8ea4c6">repositórios de código</text>
    </g>
    <g class="t t2" transform="translate(306 0)">
      <rect x="0.5" y="0.5" width="281" height="119" rx="12" fill="#0d1729" stroke="#22385f"/>
      <rect class="bar" x="24" y="22" width="40" height="3" rx="1.5" fill="url(#accent)" style="animation-delay:.5s"/>
      <text x="24" y="70" font-size="38" font-weight="700" fill="#ffffff">660+</text>
      <text x="24" y="97" font-size="13" fill="#8ea4c6">contribuições no último ano</text>
    </g>
    <g class="t t3" transform="translate(612 0)">
      <rect x="0.5" y="0.5" width="281" height="119" rx="12" fill="#0d1729" stroke="#22385f"/>
      <rect class="bar" x="24" y="22" width="40" height="3" rx="1.5" fill="url(#accent)" style="animation-delay:.7s"/>
      <text x="24" y="70" font-size="38" font-weight="700" fill="#ffffff">4</text>
      <text x="24" y="97" font-size="13" fill="#8ea4c6">plataformas próprias de ponta a ponta</text>
    </g>
    <g class="t t4" transform="translate(918 0)">
      <rect x="0.5" y="0.5" width="281" height="119" rx="12" fill="#0d1729" stroke="#22385f"/>
      <rect class="bar" x="24" y="22" width="40" height="3" rx="1.5" fill="url(#accent)" style="animation-delay:.9s"/>
      <text x="24" y="70" font-size="38" font-weight="700" fill="#ffffff">110+</text>
      <text x="24" y="97" font-size="13" fill="#8ea4c6">testes automatizados em produção</text>
    </g>
  </g>
</svg>
