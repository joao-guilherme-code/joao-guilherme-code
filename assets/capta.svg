<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="Fluxo de dados do Capta IA">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cc3ff"/>
      <stop offset="1" stop-color="#8a8cff"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#8a6bff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#8a6bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4cc3ff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <style>
    .sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
    .mono{font-family:'SF Mono','Cascadia Code',Menlo,Consolas,'Liberation Mono',monospace}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes dash{to{stroke-dashoffset:-24}}
    @keyframes breathe{0%,100%{opacity:.35}50%{opacity:.9}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    .in{opacity:0;animation:rise .8s ease-out forwards}
    .flow{fill:none;stroke:#4cc3ff;stroke-width:1.6;stroke-dasharray:5 7;opacity:.85;animation:dash 1.1s linear infinite}
    .flow2{fill:none;stroke:#8a8cff;stroke-width:1.6;stroke-dasharray:5 7;opacity:.85;animation:dash 1.1s linear infinite}
    .box{fill:#0d1729;stroke:#22385f}
    .chip{fill:#101d36;stroke:#27406b}
    .h{fill:#ffffff;font-weight:700}
    .s{fill:#8ea4c6}
    .halo{animation:breathe 4s ease-in-out infinite}
    .led{animation:blink 1.8s ease-in-out infinite}
  </style>

  <rect width="1200" height="540" rx="16" fill="#0a1020"/>
  <rect width="1200" height="540" rx="16" fill="url(#grid)"/>
  <ellipse class="halo" cx="810" cy="250" rx="300" ry="230" fill="url(#core)"/>

  <text class="mono" x="40" y="46" font-size="12" font-weight="600" fill="#4cc3ff" letter-spacing="3">FLUXO DE DADOS · CAPTA IA</text>
  <text class="sans" x="40" y="74" font-size="16" fill="#a9bdd9">Do dado bruto de CRM, mídia e WhatsApp até a decisão do gestor e do cliente.</text>

  <text class="mono" x="40" y="124" font-size="11" fill="#6f86a8" letter-spacing="3">FONTES</text>
  <text class="mono" x="360" y="124" font-size="11" fill="#6f86a8" letter-spacing="3">PIPELINE</text>
  <text class="mono" x="660" y="124" font-size="11" fill="#6f86a8" letter-spacing="3">PLATAFORMA</text>
  <text class="mono" x="1010" y="124" font-size="11" fill="#6f86a8" letter-spacing="3">USO</text>

  <g class="flow">
    <path d="M290 166 C325 166 325 200 360 200"/>
    <path d="M290 250 L360 250"/>
    <path d="M290 334 C325 334 325 300 360 300"/>
  </g>
  <g class="flow2">
    <path d="M590 250 L660 250"/>
    <path d="M960 250 L1010 250"/>
    <path d="M810 430 L810 400"/>
  </g>

  <g class="sans">
    <g class="in" style="animation-delay:.1s">
      <rect class="box" x="40.5" y="136.5" width="249" height="60" rx="10"/>
      <text class="h" x="58" y="163" font-size="15">CRM</text>
      <text class="s" x="58" y="183" font-size="12.5">negociações, etapas e vendas</text>
    </g>
    <g class="in" style="animation-delay:.2s">
      <rect class="box" x="40.5" y="220.5" width="249" height="60" rx="10"/>
      <text class="h" x="58" y="247" font-size="15">Meta Ads · Google Ads</text>
      <text class="s" x="58" y="267" font-size="12.5">investimento, campanhas e criativos</text>
    </g>
    <g class="in" style="animation-delay:.3s">
      <rect class="box" x="40.5" y="304.5" width="249" height="60" rx="10"/>
      <text class="h" x="58" y="331" font-size="15">WhatsApp</text>
      <text class="s" x="58" y="351" font-size="12.5">conversas de atendimento</text>
    </g>

    <g class="in" style="animation-delay:.5s">
      <rect x="360.5" y="136.5" width="229" height="228" rx="14" fill="#0c1a33" stroke="url(#accent)" stroke-width="1.4"/>
      <circle class="led" cx="386" cy="168" r="4.5" fill="#4cc3ff"/>
      <text class="h" x="400" y="173" font-size="19">BigQuery</text>
      <text class="mono s" x="386" y="196" font-size="11.5">data warehouse</text>
      <rect class="chip" x="384.5" y="214.5" width="181" height="44" rx="8"/>
      <text class="s" x="398" y="233" font-size="12">exportação diária</text>
      <text class="s" x="398" y="249" font-size="12">automatizada por cliente</text>
      <rect class="chip" x="384.5" y="270.5" width="181" height="44" rx="8"/>
      <text class="s" x="398" y="289" font-size="12">views de mídia e tabelas</text>
      <text class="s" x="398" y="305" font-size="12">de CRM unificadas</text>
    </g>

    <g class="in" style="animation-delay:.7s">
      <rect x="660.5" y="110.5" width="299" height="290" rx="16" fill="#0c1a33" stroke="url(#accent)" stroke-width="1.4"/>
      <circle class="led" cx="686" cy="142" r="4.5" fill="#8a8cff"/>
      <text class="h" x="700" y="147" font-size="20">Capta IA</text>
      <text class="mono s" x="686" y="168" font-size="11.5">FastAPI · Jinja2 · SQLite · ECharts</text>
      <rect class="chip" x="684.5" y="184.5" width="251" height="44" rx="9"/>
      <text class="h" x="698" y="203" font-size="13.5">Estratégia</text>
      <text class="s" x="698" y="219" font-size="12">método de captação em 9 etapas</text>
      <rect class="chip" x="684.5" y="238.5" width="251" height="44" rx="9"/>
      <text class="h" x="698" y="257" font-size="13.5">IA Comercial</text>
      <text class="s" x="698" y="273" font-size="12">resultado, previsão e vendedores</text>
      <rect class="chip" x="684.5" y="292.5" width="251" height="44" rx="9"/>
      <text class="h" x="698" y="311" font-size="13.5">IA Marketing</text>
      <text class="s" x="698" y="327" font-size="12">do anúncio ao CRM até a venda</text>
      <rect class="chip" x="684.5" y="346.5" width="251" height="44" rx="9"/>
      <text class="h" x="698" y="365" font-size="13.5">Relatórios</text>
      <text class="s" x="698" y="381" font-size="12">resumo mensal em PDF para o cliente</text>
    </g>

    <g class="in" style="animation-delay:.9s">
      <rect class="box" x="1010.5" y="190.5" width="149" height="120" rx="12"/>
      <text class="h" x="1028" y="226" font-size="15">Time e clientes</text>
      <text class="s" x="1028" y="248" font-size="12">acesso por perfil,</text>
      <text class="s" x="1028" y="264" font-size="12">tema claro e escuro,</text>
      <text class="s" x="1028" y="280" font-size="12">leitura simples</text>
    </g>

    <g class="in" style="animation-delay:1.1s">
      <rect class="box" x="660.5" y="430.5" width="299" height="70" rx="10" stroke="#8a8cff" stroke-opacity="0.65"/>
      <text class="h" x="678" y="458" font-size="15">Avaliação por IA</text>
      <text class="s" x="678" y="478" font-size="12.5">LLMs avaliam o atendimento e só confirmam o</text>
      <text class="s" x="678" y="494" font-size="12.5">perfil ideal citando o trecho da conversa</text>
    </g>
  </g>

  <text class="mono" x="40" y="480" font-size="11.5" fill="#6f86a8" letter-spacing="1.5">PYTHON · FASTAPI · BIGQUERY · CLAUDE · GEMINI</text>
</svg>
